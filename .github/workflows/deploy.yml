name: Deploy

# Vercel deployments, driven from GitHub Actions so every step is visible in the pipeline (#24).
#
# - Production: after CI passes on a push to main, build that exact commit, apply the migrations to
#   the production database, then deploy the prebuilt output. No seed data in production.
# - Preview: every pull request from this repository gets its own database branch (migrated and
#   seeded with the demo data) and its own Vercel preview URL, posted as a PR comment. The branches
#   live in a separate Neon project that never holds production data or production credentials.
#   Closing the PR deletes the branch.
#
# Configuration (see docs/DEPLOYMENT.md):
#   secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID,
#            PRODUCTION_DATABASE_URL_UNPOOLED (direct connection, for migrations),
#            NEON_API_KEY (previews only)
#   variables: NEON_PREVIEW_PROJECT_ID (the separate preview project; previews only)
#   Vercel project env: DATABASE_URL and JWT_SECRET for Production, JWT_SECRET for Preview.
# When the secrets are missing (Dependabot PRs, forks), the deploy jobs skip instead of failing.
#
# Preview connection strings are fetched from the Neon API inside the step that uses them and
# masked with ::add-mask:: before use, so they never pass through `env:` or step outputs (which
# GitHub prints in the public logs).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# Production deploys run one at a time, in order (a newer pending one replaces an older pending
# one, never a running one). Each PR has its own group, and a new push cancels its older preview.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'deploy-production' || format('deploy-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_CLI: vercel@65.4.0
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEON_API: https://console.neon.tech/api/v2
  # A new Neon project's default database and role.
  NEON_DATABASE: neondb
  NEON_ROLE: neondb_owner

jobs:
  production:
    name: Production deployment
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check that deployment is configured
        id: configured
        run: echo "ok=${{ secrets.VERCEL_TOKEN != '' && secrets.PRODUCTION_DATABASE_URL_UNPOOLED != '' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout the commit CI tested
        if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        if: steps.configured.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.configured.outputs.ok == 'true'
        run: npm ci

      # Build first: if the build fails, production is not left migrated under the old code.
      - name: Build for Vercel production
        if: steps.configured.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Apply migrations to the production database
        if: steps.configured.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
        run: npx prisma migrate deploy

      - name: Deploy to Vercel production
        id: deploy
        if: steps.configured.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Preview deployment
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
      BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check that deployment is configured
        id: configured
        run: echo "ok=${{ secrets.VERCEL_TOKEN != '' && secrets.NEON_API_KEY != '' && vars.NEON_PREVIEW_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.configured.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.configured.outputs.ok == 'true'
        run: npm ci

      # The branch's ID is not a secret; its connection strings are fetched later, where they are used.
      - name: Create this PR's database branch in the preview project
        id: neon
        if: steps.configured.outputs.ok == 'true'
        run: |
          set -euo pipefail
          neon() { curl -fsS -H "Authorization: Bearer $NEON_API_KEY" -H 'Content-Type: application/json' "$@"; }
          branch_id="$(neon "$NEON_API/projects/$NEON_PROJECT/branches" \
            | jq -r --arg name "$BRANCH_NAME" '.branches[] | select(.name == $name) | .id' | head -n 1)"
          if [ -z "$branch_id" ]; then
            branch_id="$(neon -X POST "$NEON_API/projects/$NEON_PROJECT/branches" \
              -d "$(jq -n --arg name "$BRANCH_NAME" '{branch: {name: $name}, endpoints: [{type: "read_write"}]}')" \
              | jq -r '.branch.id')"
            echo "Created $BRANCH_NAME ($branch_id)."
          else
            echo "Reusing $BRANCH_NAME ($branch_id)."
          fi
          for _ in $(seq 1 30); do
            state="$(neon "$NEON_API/projects/$NEON_PROJECT/branches/$branch_id" | jq -r '.branch.current_state')"
            [ "$state" = ready ] && break
            sleep 2
          done
          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"

      - name: Migrate and seed the preview database
        if: steps.configured.outputs.ok == 'true'
        env:
          BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          DATABASE_URL="$(curl -fsS -G -H "Authorization: Bearer $NEON_API_KEY" "$NEON_API/projects/$NEON_PROJECT/connection_uri" \
            --data-urlencode "branch_id=$BRANCH_ID" --data-urlencode "database_name=$NEON_DATABASE" \
            --data-urlencode "role_name=$NEON_ROLE" --data-urlencode "pooled=false" | jq -r '.uri')"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          npx prisma migrate deploy
          npm run db:seed

      - name: Build and deploy a Vercel preview
        id: deploy
        if: steps.configured.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          pooled_url="$(curl -fsS -G -H "Authorization: Bearer $NEON_API_KEY" "$NEON_API/projects/$NEON_PROJECT/connection_uri" \
            --data-urlencode "branch_id=$BRANCH_ID" --data-urlencode "database_name=$NEON_DATABASE" \
            --data-urlencode "role_name=$NEON_ROLE" --data-urlencode "pooled=true" | jq -r '.uri')"
          echo "::add-mask::$pooled_url"
          npx --yes "$VERCEL_CLI" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --token="$VERCEL_TOKEN"
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --token="$VERCEL_TOKEN" --env DATABASE_URL="$pooled_url")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Post the preview URL on the PR
        if: steps.configured.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="**Preview deployment** for \`${SHA:0:7}\`: $URL

          Its own database branch (\`$BRANCH_NAME\`, in the separate preview project), seeded with the demo data: sign in as \`alice@fairshare.test\` with the password \`fairshare-demo\`. Vercel Deployment Protection may ask you to sign in to Vercel first."
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" \
            || gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"

  cleanup:
    name: Delete the preview database branch
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
      BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check that deployment is configured
        id: configured
        run: echo "ok=${{ secrets.NEON_API_KEY != '' && vars.NEON_PREVIEW_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Delete preview/pr-${{ github.event.pull_request.number }}
        if: steps.configured.outputs.ok == 'true'
        run: |
          set -euo pipefail
          neon() { curl -fsS -H "Authorization: Bearer $NEON_API_KEY" "$@"; }
          branch_id="$(neon "$NEON_API/projects/$NEON_PROJECT/branches" \
            | jq -r --arg name "$BRANCH_NAME" '.branches[] | select(.name == $name) | .id' | head -n 1)"
          if [ -n "$branch_id" ]; then
            neon -X DELETE "$NEON_API/projects/$NEON_PROJECT/branches/$branch_id" > /dev/null
            echo "Deleted $BRANCH_NAME."
          else
            echo "$BRANCH_NAME does not exist; nothing to delete."
          fi

name: CI

# Runs on every pull request (whatever its base branch, so stacked PRs are checked too)
# and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run it replaces. Pushes to main are grouped by
# commit instead, so every merged commit gets a finished result, even when two PRs merge
# a minute apart. (A shared group would cancel or skip the earlier commit's run.)
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

# Stages: install -> lint/typecheck -> unit tests with coverage -> database integration tests -> build.
# Each stage needs the one before it, so a failure stops the pipeline early.
jobs:
  quality:
    name: 1. Install, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  unit:
    name: 2. Unit Tests & Coverage
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails if the finance engines drop below the coverage thresholds in vitest.config.ts.
      - name: Run unit and component tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  database:
    name: 3. Migrations, Seed & Integration Tests
    needs: unit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fairshare
          POSTGRES_PASSWORD: fairshare
          POSTGRES_DB: fairshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fairshare -d fairshare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway credentials for the CI-only database container above; not a secret.
      DATABASE_URL: postgresql://fairshare:fairshare@localhost:5432/fairshare_test?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      - name: Check that the schema matches the migrations
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Seed sample data
        run: npm run db:seed

      - name: Run integration tests
        run: npm run test:integration

  build:
    name: 4. Production Build
    needs: database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

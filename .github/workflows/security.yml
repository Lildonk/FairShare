name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly scan of main, so new advisories show up even without new commits.
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Same rule as ci.yml: cancel superseded PR runs, never a run for a commit on main.
concurrency:
  group: security-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit (production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Audits the dependencies that ship to users (no devDependencies).
      # TEMPORARY: continue-on-error stays until the Next.js upgrade decision in #24,
      # because next@14.2.35 has advisories that only a major upgrade fixes.
      # Remove continue-on-error in the upgrade PR so new high or critical advisories fail CI.
      - name: npm audit (high and critical)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fails a PR that adds or upgrades to a dependency with a high or critical advisory.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly scan of main, so new advisories show up even without new commits.
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Same rule as ci.yml: cancel superseded PR runs, never a run for a commit on main.
concurrency:
  group: security-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit (production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Audits the dependencies that ship to users (no devDependencies) and fails on critical
      # advisories. High ones that we can't fix yet are tracked in #24:
      # - postcss bundled inside next@15.5.29 (fixed only in Next 16)
      # - deepmerge-ts via the Prisma CLI, a peer of @prisma/client (fixed only in Prisma 7)
      # Go back to --audit-level=high once those upgrades land.
      - name: npm audit (critical)
        run: npm audit --omit=dev --audit-level=critical

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fails a PR that adds or upgrades to a dependency with a high or critical advisory.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
